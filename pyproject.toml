[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
# Bare `pytest` does not put the project root on sys.path the way
# `python -m pytest` does, so `from apps...` in conftest failed depending on
# how the suite was started. This makes both spellings work.
pythonpath = ["."]
testpaths = ["tests"]
