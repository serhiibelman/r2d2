name: CI

# Feature branches are merged locally rather than through pull requests here,
# so the push trigger is what actually fires. The pull_request trigger is there
# for the day that changes; concurrency keeps it from running twice.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Pi runs and what black targets; 3.13 is what the
        # development machines run. Both, so neither breaks unnoticed.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        # picamera2 is deliberately absent: it needs the system libcamera stack
        # and only exists on the Pi, so the suite has to pass without it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Check formatting
        run: black --check --diff .

      - name: Run tests
        # No .env is written on purpose - the vehicle's configuration is not
        # what is under test, and a checkout has none either.
        run: pytest -q
